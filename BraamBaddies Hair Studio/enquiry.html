<!DOCTYPE html>
<html>
<head>
    <title>Book an Appointment - BraamBaddies Hair Studio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>BraamBaddies Hair Studio</h1>
        <p>Book Your Appointment</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <h2>Book an Appointment</h2>

        <p>Fill in the form below and we will get back to you.</p>

        <form onsubmit="showMessage(); return false;">

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" required>
            <br><br>

            <label for="service">Choose a Service:</label><br>
            <select id="service" name="service" required>
                <option value="">-- Select a service --</option>
                <option value="knotless">Knotless Braids</option>
                <option value="box-braids">Box Braids</option>
                <option value="cornrows">Cornrows</option>
                <option value="wig-installation">Wig Installation</option>
            </select>
            <br><br>

            <label for="date">Preferred Date:</label><br>
            <input type="date" id="date" name="date" required>
            <br><br>

            <label for="message">Additional Message:</label><br>
            <textarea id="message" name="message" rows="5"></textarea>
            <br><br>

            <button type="submit">Submit Booking</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 BraamBaddies Hair Studio</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
